<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Lab_2</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        article {
            width: 800px;
            height: 250px;
        }

        .article-head {
            display: flex;
            justify-content: center;
            position: relative;
            top: 170px;
            border-radius: 60px;
            box-shadow: 0px -12px 10px -4px grey;
            transition: all 1s ease-in;
        }

        .article-head:hover {
            top: 170px;
            transition: all 1s ease-out;        
            cursor: pointer;    
        }

        .article-body {
            display: flex;
            align-items: center;
            padding: 10px;
            justify-content: space-around;
            box-shadow: 0px 1px 7px 5px rgba(0, 0, 0, 0.7);
        }

        img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <article class="article-head">
        <h2>Hello from Docker</h2>
    </article>
    <article class="article-body">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Jenkins_logo.svg/1483px-Jenkins_logo.svg.png"
            alt="jankins">
        <h2>launched by Jenkins</h2>
    </article>
</body>

</html>
